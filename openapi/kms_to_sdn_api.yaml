openapi: 3.1.2
info:
  title: KMS to SDN Agent API - SDN server
  description: Messages the KMS sends to the SDN
  version: 2.1.1
  contact:
    url: https://github.com/ait-crypto/kms-sdn-agent-interface-specification/discussions
  x-logo:
    url: 'https://raw.githubusercontent.com/ait-crypto/kms-sdn-agent-interface-specification/refs/heads/main/doc/figures/QUICKS-logo.png'
    backgroundColor: '#FFFFFF'
    altText: 'QUICKS logo'
servers:
  - url: https://sdn_server/api/v2/sdn
tags:
  - name: Link
  - name: Notification
  - name: API

security:
  - https: []

paths:
  /version:
    get:
      summary: Get this API version
      tags:
        - API
      description: State this SDN API version number which is implemented and supported by the KMS
      operationId: get_version
      responses:
        "200":
          description: Provided API version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "2.0.0"
                    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$' # official regex for semantic versioning, see https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
                    description: Version number in semantic versioning
                required:
                  - version
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/status:
    get:
      tags:
        - Link
      summary: Get status of link
      description: When an application queries the KMS for the status via ETSI GS QKD 014 /status message, the KMS has to provide the information how many keys are available on the link, but this involves remote peers, therefore the message is relied to the SDN to solve.
      operationId: get_link_status
      parameters:
        - in: query
          name: master_sae_id
          description: Master SAE ID as per ETSI GS QKD 014
          example: "7184f8e9-4503-45d6-a399-afb9c0e61d06"
          schema:
            type: string
          required: true

        - in: query
          name: slave_sae_id
          description: Slave SAE ID as per ETSI GS QKD 014
          example: "9dd59892-db33-4db5-8e39-76b4a44e4aea"
          schema:
            type: string
          required: true

      responses:
        "200":
          description: Successful path found and metrics available
          content:
            application/json:
              schema:
                type: object
                properties:
                  source_KME_ID:
                    type: string
                    description: Source KMS ID, most likely the one which received the query.
                  target_KME_ID:
                    type: string
                    description: Remote peer KMS id.
                  key_size:
                    type: integer
                    minimum: 0
                    description: Smallest number in bit given by KMS instances in the path stating their default key size, all other parameters use this for calculations.
                  stored_key_count:
                    type: integer
                    minimum: 0
                    description: Currently available number of key entries which could be delivered to the application. Determined by the smallest number given by KMS instances in the path. Number of keys is based on the number of entries of the default key size.
                  max_key_count:
                    type: integer
                    minimum: 0
                    description: Maximum possible key store in entries of default key sizes. Determined by the smallest number given by KMS instances in the path.
                  max_key_per_request:
                    type: integer
                    minimum: 0
                    description: Maximum key batch allowed in one request. This is determined by the smallest number given by KMS instances in the path.
                  max_key_size:
                    type: integer
                    minimum: 0
                    description: Maximum key size in bit, which KMS instances can handle. This is determined by the smallest number given by KMS instances in the path.
                  min_key_size: 
                    type: integer
                    minimum: 0
                    description: Minimum key size in bit, which can be handled. This is determined by the biggest number given by KMS instances in the path.
                  max_SAE_ID_count:
                    type: integer
                    minimum: 0
                    description: Stating if group keys are supported and if so with how many additional participants. 0 means no additional SAE IDs. This is determined by the smallest number given by the specified source and destination KMS instances.
                  status_extension:
                    type: object
                    description: any additional information. Aggregated and relayed from the instances.
                required:
                  - source_KME_ID
                  - target_KME_ID
                  - key_size
                  - stored_key_count
                  - max_key_count
                  - max_key_per_request
                  - max_key_size
                  - min_key_size
                  - max_SAE_ID_count
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/registration:
    post:
      tags:
        - Link
      summary: Post new link registration
      description: When a source APP registers with a KMS, the KMS sends the parameters supplied by the APP to the SDN. The SDN configures a path between the source and destination, verifies the QoS and returns the key stream id and adjacent node information
      operationId: post_link_registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: URI or UUID of the source APP
                  example: "172.0.10.101:5683"
                destination:
                  type: array
                  items: 
                    type: string
                    description: URI or UUID of the destination APP, multiple in case of group key.
                    minItems: 1
                    example: "172.0.10.102:5683"
                qos_request:
                  description: QoS requested by the KMS, either it is an etsi_004 or etsi_014 request.
                  $ref: "#/components/schemas/qos-data"
                performance:
                  type: array
                  description: Current performance indicators of this instance. Relevant for path selection at SDN Controller. KMS reports current values of all direct links, as it does not know yet the next hop to take.
                  items:
                    type: object
                    minItems: 1
                    properties:
                      link_id:
                        type: string
                        format: uuid
                      current_kpi:
                        $ref: "./sdn_to_kms_api.yaml#/components/schemas/kms-performance-entry"
                options:
                  type: object
                  description: Optional additional fields. "multipath" are defined. In case additional optional features are available, create new "key:value" pair in object.
                  properties:
                    multipath:
                      type: boolean
                      description: In case of a multi-path establishment, specify 'true'.
                      example: true
              required:
                - source
                - destination
                - qos_request
                - performance
      responses:
        "201":
          description: Successful registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_stream_id:
                    type: string
                    format: uuid
                  next_node_info:
                    type: array
                    minItems: 1
                    description: The URI authority of peer nodes. Usually only one entry in list, for multi path or additional SAE IDs can be multiple entries.
                    example:
                      ["172.0.10.103:5683", "172.0.10.104:5683"]
                    items:
                      type: string
                      description: At least one element.
                  qos:
                    type: object
                    description: QoS counter proposal set by the SDN, only ETSI 004
                    example:
                      {
                        "max_bps": 0,
                        "min_bps": 128,
                        "jitter": 2,
                        "priority": 0,
                        "ttl": 1,
                      }
                required:
                  - key_stream_id
                  - next_node_info

        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

    patch:
      tags:
        - Link
      summary: Update link status by destination APP
      description: When a destination APP registers with a KMS, the KMS informs the SDN of the destination APP registration. This indicates, that the path was closed.
      operationId: patch_link_registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key_stream_id:
                  type: string
                  format: uuid
                destination:
                  type: string
                  description: Of type UUID or URI
              required:
                - key_stream_id
                - destination
      responses:
        "200":
          description: Successful registration
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint not found.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/{key_stream_id}:
    delete:
      tags:
        - Link
      summary: Delete key stream
      description: If the ETSI 004 application closes a key stream, this is reported to the SDN
      operationId: delete_link_ks_id
      parameters:
        - name: key_stream_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Link closed
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint not found.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /notification/registration:
    post:
      tags:
        - Notification
      summary: Post KMS added to network
      description: Inform the SDN of a new KMS that has been added to the network. If local instance has information about connected QKD devices or links, specify in request body.
      operationId: post_notification_registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kms_id:
                  type: string
                  format: uuid
                model:
                  type: object
                  properties:
                    device_vendor:
                      type: string
                      example: "AIT"
                      description: Vendor of the KMS
                    device_model:
                      type: string
                      example: "AURORA KMS"
                      description: Device brand name
                    device_version:
                      type: string
                      example: "1.0.0"
                      description: version number in semantic versioning
                  required:
                    - device_vendor
                    - device_model
                    - device_version
                qkd_device_ids:
                  description: If known connected QKD devices
                  type: array
                  items:
                    type: string
                    format: uuid
                link_ids:
                  description: If known connected links
                  type: array
                  items:
                    type: string
                    format: uuid
              required:
                - kms_id
                - model
      responses:
        "201":
          description: Registration received. Optionally additional config data provided in response. Config file data format or content not defined and expected to be vendor specific.
          content:
            application/octet-stream:
              schema:
                type: string
                description: Optionally respond with initial config file. The file format is not specified.
                format: binary
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint not found
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /notification/status:
    patch:
      tags:
        - Notification
      summary: Update KMS status
      description: Inform the SDN of when the KMS's status changes, e.g. the KMS goes into maintenance mode
      operationId: patch_notification_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  example: "stopped"
                reason:
                  type: string
                  example: "maintenance"
              required:
                - state
                - reason
      responses:
        "200":
          description: Status received
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint not found
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /notification/event:
    put:
      tags:
        - Notification
      summary: Update event at KMS
      description: Inform the SDN of an event
      operationId: put_notification_event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum: [debug, info, warning, error, critical]
                code:
                  type: integer
                  example: 14
                reason:
                  type: string
                  example: "stopped"
              required:
                - level
                - reason
      responses:
        "200":
          description: Event information received
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint not found.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

components:
  securitySchemes:
    https:
      type: mutualTLS
      description: Connections must use TLS 1.3. The server enforces this at the transport layer.
  
  schemas:
    error-response:
      type: object
      properties:
        type:
          type: string
          description: "Webpage with information on this problem"
        title:
          type: string
          description: "Brief description of the problem"
        status:
          type: integer
          description: "Response code or status code"
        detail:
          type: string
          description: "Information on the problem and hints on how to solve it"
      required:
        - title
        - status
        - detail

    qos-data:
      type: object
      description: QoS requested by the KMS, either it is an etsi_004 or etsi_014 request.
      properties:
        type:
          type: string
          enum:
            - etsi_004
            - etsi_014
          example: etsi_014

        etsi_014:
          type: object
          description: only present if APP request was via ETSI 014
          properties:
            number:
              type: integer
              example: 1
              description: Number of keys
            size:
              type: integer
              example: 256
              description: Size of keys in bit
            extensions:
              type: array
              items:
                type: object
                example: { "example_key": "example_value" }
                description: From "extensions_mandatory" and "extension_optional" of ETSI GS QKD 014
          required:
            - number
            - size

        etsi_004:
          type: object
          description: only present if APP request was via ETSI 004. All values according to ETSI GS QKD 004 specification
          properties:
            key_chunk_size:
              type: integer
              description: length of key chunks in Byte.
              example: 32
            max_bps:
              type: integer
              example: 128
            min_bps:
              type: integer
              example: 64
            jitter:
              type: integer
              example: 1
            priority:
              type: integer
              example: 3
            timeout:
              type: integer
              example: 50
            ttl:
              type: integer
              example: 5
            metadata_mimetype:
              type: string
              example: application/json
          required:
            - key_chunk_size
            - max_bps
            - min_bps
            - ttl
      required:
        - type
