openapi: 3.1.2
info:
  title: SDN Agent to KMS API
  description: Messages the SDN sends to the KMS
  version: 2.0.0
  contact:
    url: https://github.com/ait-crypto/kms-sdn-agent-interface-specification/issues
servers:
  - url: http://kms_server/api/v2/sdn
tags:
  - name: monitor
    description: Generic monitoring endpoints
  - name: control
    description: Generic control endpoints
  - name: link
    description: Monitoring and control related with the link
  - name: API
    description: Generic endpoints related with this API

security:
  - https: []

paths:
  /version:
    get:
      summary: Get this API version
      tags:
        - API
      description: State this SDN API version number which is implemented and supported by the KMS
      operationId: get_version
      responses:
        "200":
          description: Provided API version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "2.0.0"
                    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$' # official regex for semantic versioning, see https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
                    description: Version number in semantic versioning
                required:
                  - version
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/capabilities:
    get:
      tags:
        - monitor
      summary: Get KMS capabilities
      description: Query which essential features are supported by this instance.
      operationId: get_monitor_capabilities
      responses:
        "200":
          description: The response states whether or not the KMS provides key relay support.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_relay_support:
                    type: boolean
                    enum: [true, false]
                    example: true
                    description: true = key relay supported, false = it isn't
                  app_api_support:
                    type: string
                    enum: ["etsi_004", "etsi_014", "kmip", "skip"]
                    example: "etsi_014"
                    description: specify supported interfaces. Above strings should be used. If additional interfaces are provided, state lower case snake case name.
                required:
                  - key_relay_support
                  - app_api_support
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/device-info:
    get:
      tags:
        - monitor
      summary: Get vendor, model and version
      description: Publish KMS instance vendor, model and version
      operationId: get_monitor_model
      responses:
        "200":
          description: The response contains the vendor, device and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendor:
                    type: string
                    example: "AIT"
                    description: Vendor of the KMS
                  model:
                    type: string
                    example: "AURORA KMS"
                    description: Device brand name (model)
                  version:
                    type: string
                    example: "1.0.0"
                    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$' # official regex for semantic versioning, see https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
                    description: Version number in semantic versioning
                required:
                  - vendor
                  - model
                  - version
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/status:
    get:
      tags:
        - monitor
      summary: Get KMS status
      description: Get the status from the KMS, it can be online or stopped.
      operationId: get_monitor_status
      responses:
        "200":
          description: description of the status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: ["online", "stopped"]
                    example: "online"
                    description: If the KMS is able to answer, it can only answer online or stopped. If it can't answer it is assumed to be offline, see errors below. Stopped is a state, where the KMS is alive but not operational, which could for example be a maintenance state or similar.
                  operation:
                    type: string
                    enum: ["normal operation", "warnings", "errors", "critical"]
                    example: "normal operation"
                    description: state if there are any operational issues. This may correlate to entries in the KMS log.
                required:
                  - state
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

        "404":
          description: KMS can't be reached, therefore has to be assumed offline.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/log:
    get:
      tags:
        - monitor
      summary: Get full logging info
      description: get the log file from the KMS
      operationId: get_monitor_log
      responses:
        "200":
          description: Log file. State the file format in the MIME type notation in the http Content-Type header. Any type can be returned, some examples are given, but it is beyond this specification to specify the log format.
          content:
            "*/*":
              schema:
                type: string
                format: binary
              example: "[File content of any type]"
            text/plain:
              schema:
                type: string
                format: binary
                example: |
                  [2025-12-11 10:00:00] INFO: System started
                  [2025-12-11 10:01:05] WARN: Retry QKD connection
                  [2025-12-11 10:02:30] ERROR: QKD device not reachable
            application/json:
              schema:
                type: string
                format: binary
                example: |
                  [
                    {"timestamp": "2025-12-11T10:00:00Z", "level": "INFO", "message": "System started"},
                    {"timestamp": "2025-12-11T10:01:05Z", "level": "WARN", "message": "Retry QKD connection"},
                    {"timestamp": "2025-12-11T10:02:30Z", "level": "ERROR", "message": "QKD device not reachable"}
                  ]
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
                example: "[sqlite database file]"
            application/octet-stream:
              schema:
                type: string
                format: binary
                example: "[Generic binary log file]"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/qkd-device:
    get:
      tags:
        - monitor
      summary: Get known QKD devices and status
      description: Receive QKD device information the KMS instance has.
      operationId: get_qkd_devices
      responses:
        "200":
          description: QKD devices information correctly returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  qkd_devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/qkd-device-info"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: QKD devices information could not be returned because of a server-side error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qkd-device-info-connection"

  /control/status:
    put:
      tags:
        - control
      summary: Modify state of the KMS
      description: Modify state of the KMS, it can be online, stopped or offline.
      operationId: put_control_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                  enum: ["stopped", "offline", "online"]
                  example: "offline"
              required:
                - state
      responses:
        "200":
          description: changing state successful
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: Forbidden, client does not have the required rights.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /control/qkd-device:
    post:
      tags:
        - control
      summary: Register a new QKD device
      description: Create/register a new QKD device in the KMS instance.
      operationId: create_qkd_device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/qkd-device-info-connection"
      responses:
        "201":
          description: QKD device successfully created
        "400":
          description: Invalid input (missing fields or malformed body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qkd-device-info-connection"
        "409":
          description: Device already exists (conflict on device_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qkd-device-info-connection"
        "500":
          description: Server-side error while creating the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qkd-device-info-connection"

    put:
      tags:
        - control
      summary: Update an existing QKD device
      description: Update mutable fields of a known QKD device.
      operationId: update_qkd_device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/qkd-device-info-connection"

      responses:
        "200":
          description: QKD device updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  qkd_device:
                    $ref: "#/components/schemas/qkd-device-info"
        "400":
          description: Invalid input (missing device_id or malformed update object)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qkd-device-info-connection"
        "404":
          description: Not found. This corresponds to the endpoint not found, as 404s can also be generated by the webserver. Use 400 if the device ID string was unknown to KMS
        "500":
          description: Server-side error while updating the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/qkd-device-info-connection"

  /control/qkd-device/{device_id}:
    delete:
      tags:
        - control
      summary: Delete QKD device
      description: remove connected QKD device, KMS will no longer try to obtain keys from it.
      operationId: delete_control_qkd_device
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            format: uuid
            example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
      responses:
        "204":
          description: QKD device correctly deleted
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/performance/{link_id}:
    get:
      tags:
        - link
      summary: Get performance data for link
      description: Get the performance data for the link with the given link id. Query parameter for entries is optional.
      operationId: get_link_performance
      parameters:
        - name: link_id
          description: link's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entries
          description: Optional. Number of history records requested. If not specified maximal available history is returned. If 0, only current value is transmitted.
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The response contains KMS performance data
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    description: The latest data entry.
                    $ref: "#/components/schemas/kms-performance-entry"
                  history:
                    items:
                      $ref: "#/components/schemas/kms-performance-entry"
                    example:
                      - timestamp: "2024-08-27T17:41:28Z"
                        delta_t: 10000
                        IKR: 144
                        SKR: 1250
                        EXKR: 320
                        KAV: 1810
                      - timestamp: "2024-08-27T17:31:28Z"
                        delta_t: 10000
                        IKR: 144
                        SKR: 1250
                        EXKR: 320
                        KAV: 1024
                required:
                  - current
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/relay/{key_stream_id}:
    post:
      tags:
        - link
      summary: Create link relay configuration
      description: Create a link relay configuration record with the data in the request, using the given key_stream_id as an identifier
      operationId: post_relay_config
      parameters:
        - name: key_stream_id
          description: key_stream_id's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: URI or UUID of the source APP
                  example: "http://172.0.10.101:5683"
                destination:
                  type: array
                  items: 
                    type: string
                    description: URI or UUID of the destination APP, multiple in case of group key.
                    example: "http://172.0.10.102:5683"
                    minItems: 1
                next_node_info:
                  type: array
                  description: List of adjacent nodes. Type URI authority
                  items:
                    type: string
                  example: ["kms-1.net:5683", "kms-3.net:5684"]
                qos_request:
                  description: QoS requested by the KMS
                  $ref: "./kms_to_sdn_api.yaml#/components/schemas/qos-data"
              required:
                - source
                - destination
                - next_node_info
      responses:
        "201":
          description: A new relay configuration has been created with the given key_stream_id as an identifier, from the data in the request
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
    put:
      tags:
        - link
      summary: Update a link relay configuration
      description: Replace a link relay configuration with the data in the request, using the given key_stream_id as an identifier. Only the data to be changed should be included in data body, supporting partial updates.
      operationId: put_relay_config
      parameters:
        - name: key_stream_id
          description: key_stream_id's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Source APP's URI or UUID
                  example: "http://172.0.10.101:5683"
                destination:
                  type: array
                  items: 
                    type: string
                    description: URI or UUID of the destination APP, multiple in case of group key.
                    example: "http://172.0.10.102:5683"
                    minItems: 1
                next_node_info:
                  type: array
                  description: List of adjacent nodes. Type URI authority.
                  items:
                    type: string
                  example:
                    ["172.0.10.103:5683", "172.0.10.103:5684"]
                qos_request:
                  type: object
                  description: QoS requested by the KMS
                  example:
                    {
                      "key_chunk_size": 4,
                      "max_bps": 128,
                      "min_bps": 64,
                      "jitter": 1,
                      "priority": 3,
                      "timeout": 50,
                      "ttl": 5,
                      "metadata_mimetype": "application/json",
                    }
      responses:
        "200":
          description: The relay configuration associated with the given key_stream_id has been replaced by the data in the request
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

    delete:
      tags:
        - link
      summary: Delete relay configuration
      description: Delete the relay configuration associated with the given key_stream_id
      operationId: delete_relay_config
      parameters:
        - name: key_stream_id
          description: key stream's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Forward table row deleted
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

components:
  securitySchemes:
    https:
      type: mutualTLS
      description: Connections must use TLS 1.3. The server enforces this at the transport layer.

  schemas:
    error-response:
      type: object
      properties:
        type:
          type: string
          description: "Webpage with information on this problem"
        title:
          type: string
          description: "Brief description of the problem"
        status:
          type: integer
          description: "Response code or status code"
        detail:
          type: string
          description: "Information on the problem and hints on how to solve it"
      required:
        - title
        - status
        - detail

    qkd-device-info:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        label:
          type: string
          description: Human readable label, for example vendor name and model number.
          example: "'Alice & Bob Quantum Inc.' on node AIT"
        state:
          type: string
          enum:
            - "online"
            - "stopped"
            - "offline"
        interface:
          type: string
          enum:
            - "etsi_004"
            - "etsi_014"
            - "skip"
            - "kmip"
        protocol:
          type: string
          description: for ETSI GS QKD 014 and SKIP typically https.
          example: https
        peer_kms:
          type: string
          description: to which peer is this device connected, does not have to be UUID format, but unique in network
          example: "53d3fa09-9e87-40d5-a7c0-974fcfe95c72"
      required:
        - device_id
        - state
        - label
        - interface
        - protocol
        - peer_kms

    qkd-device-info-connection:
      allOf:
        - $ref: "#/components/schemas/qkd-device-info"
        - type: object
          description: additional properties are allowed if supported by SDN and KMS.
          properties:
            server_address:
              type: string
              format: uri
            primary_id:
              description: In ETSI GS QKD 014 also called Master SAE ID
              type: string
              example: "6a45ee57-8673-40cb-97ed-6f4f06e1f975"
            secondary_id:
              description: In ETSI GS QKD 014 also called Slave SAE ID
              type: string
              example: "55169914-40a0-43de-8cf1-d3472db644bd"
          required:
            - server_address
            - primary_id
            - secondary_id

    kms-performance-entry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 format
          example: "2024-08-27T17:41:28Z"
        delta_t:
          description: >
            Time period over which keys are counted for the rate calculation.
            The unit is milliseconds.
          type: integer
          format: int32
          default: 10
          example: 10000
        IKR:
          description: >
            Internal Key Rate = amount of key material reserved for internal use
            during a delta_t period divided by delta_t. Given in Byte/sec
          type: integer
          format: int32
          example: 50
        EXKR:
          description: >
            External Key Rate = amount of key material reserved for external use
            during a delta_t period divided by delta_t. Given in Byte/sec
          type: integer
          format: int32
          example: 50
        SKR:
          description: >
            Secret Key Rate = amount of key material received from QKD devices
            during a delta_t period divided by delta_t. Given in Byte/sec
          type: integer
          format: int32
          example: 500
        KAV:
          description: >
            Key Availability = amount of key material in Byte available to
            Applications during a delta_t period
          type: integer
          format: int32
          example: 400
      required:
        - timestamp
        - delta_t
        - IKR
        - EXKR
        - SKR
        - KAV
