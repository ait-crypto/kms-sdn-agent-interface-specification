openapi: 3.1.2
info:
  title: SDN Agent to KMS API
  description: Messages the SDN sends to the KMS
  version: 2.1.0
  contact:
    url: https://github.com/ait-crypto/kms-sdn-agent-interface-specification/issues
servers:
  - url: http://kms_server/api/v2/sdn
tags:
  - name: monitor
    description: Generic monitoring endpoints
  - name: control
    description: Generic control endpoints
  - name: link
    description: Monitoring and control related with the link
  - name: API
    description: Generic endpoints related with this API

security:
  - https: []

paths:
  /version:
    get:
      summary: Get this API version
      tags:
        - API
      description: QUICKS API version number which is implemented and supported by the KMS
      operationId: get_version
      responses:
        "200":
          description: Provided API version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    description: Version number in semantic versioning
                    type: string
                    example: "2.0.0"
                    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$' # official regex for semantic versioning, see https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
                required:
                  - version
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/capabilities:
    get:
      tags:
        - monitor
      summary: Get KMS capabilities
      description: Query which essential features are supported by this instance.
      operationId: get_monitor_capabilities
      responses:
        "200":
          description: The response states different KMS API capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_relay_support:
                    type: boolean
                    enum: [true, false]
                    example: true
                    description: Is this KMS instance capable of relaying keying material? If true, key relay supported, if false it isn't.
                  app_api_support:
                    type: array
                    items:
                      type: string
                      enum: ["etsi_004", "etsi_014", "kmip", "skip"]
                      example: "etsi_014"
                      description: Supported interfaces by the KMS. The enum defined strings should be used. If additional interfaces are provided, state lower case snake case name.
                  etsi_014_info:
                    type: object
                    properties:
                      KME_ID: 
                        type: string
                        description: This KMS instance ID
                      key_size:
                        type: integer
                        minimum: 0
                        description: Number in bit stating the default key size of this KMS, all other parameters use this for calculations.
                      stored_key_count:
                        type: integer
                        minimum: 0
                        description: Number of stored keys which are available and could be delivered to the application. Number of keys is based on number of entries of the default key size. Sum of all Links, per link data available via link performance endpoint.
                      max_key_count:
                        type: integer
                        minimum: 0
                        description: Number stating this KMS instance maximum key store. This assumes above default key size.
                      max_key_per_request:
                        type: integer
                        minimum: 0
                        description: Number stating this KMS instance maximum key entries, which can be handled at once. For example number of keys which can be requested via ETSI GS QKD 014 at once or forwarded through this instance at once.
                      max_key_size:
                        type: integer
                        minimum: 0
                        description: Number in bit stating the biggest key size this KMS can handle.
                      min_key_size: 
                        type: integer
                        minimum: 0
                        description: Number in bit stating the smallest key size this KMS can handle.
                      max_SAE_ID_count:
                        type: integer
                        minimum: 0
                        description: Number stating if this KMS supports group keys and if so with how many participants. 0 means no group keys, 1 is one additional slave SAE etc.
                      status_extension:
                        type: object
                        description: Any additional information. It is aggregated from all KMS instances in the SDN Controller.
                    required:
                      - source_KME_ID
                      - target_KME_ID
                      - key_size
                      - stored_key_count
                      - max_key_count
                      - max_key_per_request
                      - max_key_size
                      - min_key_size
                      - max_SAE_ID_count
                required:
                  - key_relay_support
                  - app_api_support
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/device-info:
    get:
      tags:
        - monitor
      summary: Get vendor, model and version
      description: Publish KMS instance vendor, model and version
      operationId: get_monitor_model
      responses:
        "200":
          description: The response contains the vendor, device and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  vendor:
                    type: string
                    example: "AIT"
                    description: Vendor of the KMS
                  model:
                    type: string
                    example: "AURORA KMS"
                    description: Device brand name (model)
                  version:
                    description: Version number in semantic versioning
                    type: string
                    example: "1.0.0"
                    pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$' # official regex for semantic versioning, see https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
                required:
                  - vendor
                  - model
                  - version
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/status:
    get:
      tags:
        - monitor
      summary: Get KMS status
      description: Get the status from the KMS, it can be online or stopped.
      operationId: get_monitor_status
      parameters:
        - in: query
          name: new_operation_state_only
          required: false
          description: If true, only consider operational status events since last query. If not given default of "false" is used.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: description of the status
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    enum: ["online", "stopped", "offline"]
                    example: "online"
                    description: State of the KMS. "online" if operational, stopped if running but not operational, offline if not operational. If it can't answer it is assumed to be offline, see error below. Stopped is a state, where the KMS is running but not operational, which could for example be a maintenance state or similar.
                  operation:
                    type: string
                    enum: ["normal operation", "warnings", "errors", "critical"]
                    example: "normal operation"
                    description: state if there are any operational issues. This may correlate to entries in the KMS log.
                required:
                  - state
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

        "404":
          description: KMS can't be reached, therefore has to be assumed offline.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/log:
    get:
      tags:
        - monitor
      summary: Get full logging info
      description: get the log file from the KMS
      operationId: get_monitor_log
      responses:
        "200":
          description: Log file of the KMS. State the file format in the MIME type notation in the http Content-Type header. Any type can be returned, some examples are given, but it is beyond this specification to specify the log format.
          content:
            "*/*":
              schema:
                type: string
                format: binary
              example: "[File content of any type]"
            text/plain:
              schema:
                type: string
                format: binary
                example: |
                  [2025-12-11 10:00:00] INFO: System started
                  [2025-12-11 10:01:05] WARN: Retry QKD connection
                  [2025-12-11 10:02:30] ERROR: QKD device not reachable
            application/json:
              schema:
                type: string
                format: binary
                example: |
                  [
                    {"timestamp": "2025-12-11T10:00:00Z", "level": "INFO", "message": "System started"},
                    {"timestamp": "2025-12-11T10:01:05Z", "level": "WARN", "message": "Retry QKD connection"},
                    {"timestamp": "2025-12-11T10:02:30Z", "level": "ERROR", "message": "QKD device not reachable"}
                  ]
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
                example: "[sqlite database file]"
            application/octet-stream:
              schema:
                type: string
                format: binary
                example: "[Generic binary log file]"
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /monitor/qkd-device:
    get:
      tags:
        - monitor
      summary: Get known QKD devices and status
      description: Receive QKD device information the KMS instance has.
      operationId: get_qkd_devices
      responses:
        "200":
          description: QKD devices information correctly returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  qkd_devices:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            device_id:
                              type: string
                              format: uuid
                          required:
                            - device_id
                        - $ref: "#/components/schemas/qkd-device-info"
                      required:
                        - link_id
                        - state
                        - interface
                        - protocol
                        - peer_kms
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: QKD devices information could not be returned because of a server-side error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"

  /control/status:
    put:
      tags:
        - control
      summary: Modify state of the KMS
      description: Modify state of the KMS, it can be online, stopped or offline.
      operationId: put_control_status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  description: Target state of the KMS.
                  type: string
                  enum: ["stopped", "offline", "online"]
                  example: "offline"
              required:
                - state
      responses:
        "200":
          description: changing state successful
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "403":
          description: Forbidden, client does not have the required rights.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /control/qkd-device/{device_id}:
    post:
      tags:
        - control
      summary: Register a new QKD device
      description: Create/register a new QKD device in the KMS instance.
      operationId: create_qkd_device
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/qkd-device-info-connection-post"
      responses:
        "201":
          description: QKD device successfully created
        "400":
          description: Invalid input (missing fields or malformed body)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "409":
          description: Device already exists (conflict on device_id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Server-side error while creating the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"

    put:
      tags:
        - control
      summary: Update an existing QKD device
      description: Update mutable fields of a known QKD device.
      operationId: update_qkd_device
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/qkd-device-info-connection"

      responses:
        "200":
          description: QKD device updated successfully
        "400":
          description: Invalid input (missing device_id or malformed update object)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found. This corresponds to the endpoint not found, as 404s can also be generated by the webserver. Use 400 if the device ID string was unknown to KMS
        "500":
          description: Server-side error while updating the device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error-response"
    delete:
      tags:
        - control
      summary: Delete QKD device
      description: Remove connected QKD device, KMS will no longer try to obtain keys from it.
      operationId: delete_control_qkd_device
      parameters:
        - in: path
          name: device_id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: QKD device correctly deleted
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/performance/{link_id}:
    get:
      tags:
        - link
      summary: Get performance data for link
      description: Get the performance data for the link with the given link id. Query parameter for entries is optional.
      operationId: get_link_performance
      parameters:
        - name: link_id
          description: link's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: entries
          description: Optional. Number of history records requested. If not specified maximal available history is returned. If 0, only current value is transmitted.
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: The response contains KMS performance data
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    description: The latest data entry.
                    $ref: "#/components/schemas/kms-performance-entry"
                  history:
                    items:
                      $ref: "#/components/schemas/kms-performance-entry"
                    example:
                      - timestamp: "2024-08-27T17:41:28Z"
                        delta_t: 10000
                        IKR: 144
                        SKR: 1250
                        EXKR: 320
                        KAV: 1810
                      - timestamp: "2024-08-27T17:31:28Z"
                        delta_t: 10000
                        IKR: 144
                        SKR: 1250
                        EXKR: 320
                        KAV: 1024
                required:
                  - current
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist, probably invalid link_id given.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

  /link/relay/{key_stream_id}:
    post:
      tags:
        - link
      summary: Create link relay configuration
      description: Create a link relay configuration record with the data in the request, using the given key_stream_id as an identifier
      operationId: post_relay_config
      parameters:
        - name: key_stream_id
          description: key_stream_id's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: URI or UUID of the source APP
                  example: "http://172.0.10.101:5683"
                destination:
                  type: array
                  items: 
                    type: string
                    description: URI or UUID of the destination APP, multiple in case of group key.
                    example: "http://172.0.10.102:5683"
                    minItems: 1
                next_node_info:
                  type: array
                  description: List of adjacent nodes. Type URI authority
                  items:
                    type: string
                  example: ["kms-1.net:5683", "kms-3.net:5684"]
                qos_request:
                  description: QoS requested by the KMS
                  $ref: "./kms_to_sdn_api.yaml#/components/schemas/qos-data"
              required:
                - source
                - destination
                - next_node_info
      responses:
        "201":
          description: A new relay configuration has been created with the given key_stream_id as an identifier, from the data in the request
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
    put:
      tags:
        - link
      summary: Update a link relay configuration
      description: Replace a link relay configuration with the data in the request, using the given key_stream_id as an identifier. Only the data to be changed should be included in data body, supporting partial updates.
      operationId: put_relay_config
      parameters:
        - name: key_stream_id
          description: key_stream_id's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  description: Source APP's URI or UUID
                  example: "http://172.0.10.101:5683"
                destination:
                  type: array
                  items: 
                    type: string
                    description: URI or UUID of the destination APP, multiple in case of group key.
                    example: "http://172.0.10.102:5683"
                    minItems: 1
                next_node_info:
                  type: array
                  description: List of adjacent nodes. Type URI authority.
                  items:
                    type: string
                  example:
                    ["172.0.10.103:5683", "172.0.10.103:5684"]
                qos_request:
                  type: object
                  description: QoS requested by the KMS
                  example:
                    {
                      "key_chunk_size": 4,
                      "max_bps": 128,
                      "min_bps": 64,
                      "jitter": 1,
                      "priority": 3,
                      "timeout": 50,
                      "ttl": 5,
                      "metadata_mimetype": "application/json",
                    }
      responses:
        "200":
          description: The relay configuration associated with the given key_stream_id has been replaced by the data in the request
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist, probably invalid key_stream_id given.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

    delete:
      tags:
        - link
      summary: Delete relay configuration
      description: Delete the relay configuration associated with the given key_stream_id
      operationId: delete_relay_config
      parameters:
        - name: key_stream_id
          description: key stream's UUID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Forward table row deleted
        "400":
          description: Bad request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"
        "404":
          description: Not found, API endpoint does not exist, probably invalid key_stream_id given.
        "500":
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/error-response"

components:
  securitySchemes:
    https:
      type: mutualTLS
      description: Connections must use TLS 1.3. The server enforces this at the transport layer.

  schemas:
    error-response:
      type: object
      properties:
        type:
          type: string
          description: "Webpage with information on this problem"
        title:
          type: string
          description: "Brief description of the problem"
        status:
          type: integer
          description: "Response code or status code"
        detail:
          type: string
          description: "Information on the problem and hints on how to solve it"
      required:
        - title
        - status
        - detail

    qkd-device-info:
      type: object
      properties:
        link_id:
          description: The ID of the link this device is associate to.
          type: string
          format: uuid
        label:
          type: string
          description: Human readable label, for example vendor name and model number.
          example: "'Alice & Bob Quantum Inc.' on node AIT"
        state:
          type: string
          description: Current or target state after successful operation
          enum:
            - "online"
            - "stopped"
            - "offline"
        interface:
          type: string
          description: Interface type of the QKD device
          enum:
            - "etsi_004"
            - "etsi_014"
            - "skip"
        protocol:
          type: string
          description: Transport protocol used, for ETSI GS QKD 014 typically https.
          example: https
        peer_kms:
          type: string
          description: to which peer is this device connected, does not have to be UUID format, but unique in network
          example: "53d3fa09-9e87-40d5-a7c0-974fcfe95c72"

    qkd-device-info-connection-post:
      allOf:
        - $ref: "#/components/schemas/qkd-device-info-connection"
        - type: object
          required:
            - link_id
            - state
            - label
            - interface
            - protocol
            - peer_kms
            - server_address

    qkd-device-info-connection:
      allOf:
        - $ref: "#/components/schemas/qkd-device-info"
        - type: object
          description: additional properties are allowed if supported by SDN and KMS.
          properties:
            server_address:
              description: URI of the QKD device server. Specify domain (or IP) and port.
              type: string
              example: "172.0.10.101:5683"
            etsi_014:
              description: Only required if QKD device uses ETSI GS QKD 014 interface.
              type: object
              properties:
                primary_id:
                  description: In ETSI GS QKD 014 also called Master SAE ID
                  type: string
                  example: "6a45ee57-8673-40cb-97ed-6f4f06e1f975"
                secondary_id:
                  description: In ETSI GS QKD 014 also called Slave SAE ID
                  type: string
                  example: "55169914-40a0-43de-8cf1-d3472db644bd"
              required:
                - primary_id
                - secondary_id
            etsi_004:
              $ref: "#/components/schemas/etsi_004_device_QoS_data"
        
    etsi_004_device_QoS_data:
      type: object
      description: only required if QKD device uses ETSI GS QKD 004 interface. All values according to ETSI GS QKD 004 specification.
      properties:
        source:
          type: string
          format: URI
          description: source URI
        destination:
          type: string
          format: URI
          description: source URI
        key_chunk_size:
          type: integer
          description: length of key chunks in Byte.
          example: 32
        max_bps:
          type: integer
          example: 128
        min_bps:
          type: integer
          example: 64
        jitter:
          type: integer
          example: 1
        priority:
          type: integer
          example: 3
        timeout:
          type: integer
          example: 50
        ttl:
          type: integer
          example: 5
        metadata_mimetype:
          type: string
          example: application/json
      required:
        - source
        - destination

    kms-performance-entry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 format
          example: "2024-08-27T17:41:28Z"
        delta_t:
          description: >
            Time period over which keys are counted for the rate calculation.
            The unit is milliseconds.
          type: integer
          format: int32
          default: 10
          example: 10000
        IKR:
          description: >
            Internal Key Rate = amount of key material reserved for internal use
            during a delta_t period divided by delta_t. Given in Byte/sec
          type: integer
          format: int32
          example: 50
        EXKR:
          description: >
            External Key Rate = amount of key material reserved for external use
            during a delta_t period divided by delta_t. Given in Byte/sec
          type: integer
          format: int32
          example: 50
        SKR:
          description: >
            Secret Key Rate = amount of key material received from QKD devices
            during a delta_t period divided by delta_t. Given in Byte/sec
          type: integer
          format: int32
          example: 500
        KAV:
          description: >
            Key Availability = amount of key material in Byte available to
            Applications during a delta_t period
          type: integer
          format: int32
          example: 400
      required:
        - timestamp
        - delta_t
        - IKR
        - EXKR
        - SKR
        - KAV

